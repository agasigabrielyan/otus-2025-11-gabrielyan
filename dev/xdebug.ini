; Copy to both SAPI after: sudo apt install php8.4-xdebug
;   sudo cp dev/xdebug.ini /etc/php/8.4/apache2/conf.d/20-xdebug.ini
;   sudo cp dev/xdebug.ini /etc/php/8.4/cli/conf.d/20-xdebug.ini
;   sudo systemctl restart apache2

zend_extension=xdebug

xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.client_host=127.0.0.1
xdebug.client_port=9003
xdebug.idekey=VSCODE

; Log only if something fails (optional)
; xdebug.log=/tmp/xdebug.log
; xdebug.log_level=7
